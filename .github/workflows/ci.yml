name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Public source and history checks
        run: python3 tools/verify_public.py --history
      - name: Native protocol tests
        run: swift test --package-path scripts/link
      - name: Python, installation, and encrypted transport tests
        run: python3 -m unittest discover -s tests -v
      - name: Whitespace check
        run: git diff --check
